<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashMart | Premium E-commerce</title>
    <link rel="stylesheet" href="./styel.css">
</head>
<body class="lamp-off">

    <div id="login-page">
        <div class="interactive-area">
            <div class="login-card">
                <h2 id="form-title">Member Login</h2>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email (admin@gmail.com)">
                    <input type="password" id="pass" placeholder="Password (12345)">
                </div>
                <button id="login-btn">Enter Shop</button>
                <p class="switch-mode">New user? <span id="auth-toggle">Create Account</span></p>
            </div>

            <div class="lamp-wrapper">
                <div class="lamp-head">
                    <div class="lamp-eyes"><span></span><span></span></div>
                    <div class="lamp-smile"></div>
                </div>
                <div class="lamp-stick"></div>
                <div class="lamp-base"></div>
                <div class="pull-cord" id="pull-trigger">
                    <div class="thread"></div>
                    <div class="knob"></div>
                </div>
                <div class="glow-effect"></div>
            </div>
        </div>
    </div>

    <div id="shop-page" style="display: none;">
        <header class="modern-nav">
            <div class="logo">Yash<span>MART</span></div>
            <nav>
                <a href="#men">Men</a>
                <a href="#women">Women</a>
                <a href="#kids">Kids</a>
            </nav>
            <button class="exit-btn" onclick="location.reload()">Logout</button>
        </header>

        <main class="content-wrapper">
            <section id="men" class="shop-section">
                <h2 class="title">👔 Men's Premium Fashion</h2>
                <div class="grid" id="men-items"></div>
            </section>

            <section id="women" class="shop-section">
                <h2 class="title">🧥 Women's Elite Collection</h2>
                <div class="grid" id="women-items"></div>
            </section>

            <section id="kids" class="shop-section">
                <h2 class="title">🧸 Kids' Wonderland</h2>
                <div class="grid" id="kids-items"></div>
            </section>
        </main>
    </div>

    <div id="payment-modal" class="modal-overlay">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="pay-step">
                <h3>Select Payment</h3>
                <div class="pay-options">
                    <button class="pay-item bkash" onclick="showForm('bKash')">bKash</button>
                    <button class="pay-item nagad" onclick="showForm('Nagad')">Nagad</button>
                    <button class="pay-item card" onclick="showForm('Bank Card')">Bank Card</button>
                </div>
            </div>
            <div id="ship-step" style="display:none;">
                <h3>Shipping Details (<span id="method-name"></span>)</h3>
                <form onsubmit="confirmOrder(event)" class="ship-form">
                    <input type="text" placeholder="Your Full Name" required>
                    <input type="text" placeholder="Phone Number" required>
                    <div class="row">
                        <input type="text" placeholder="District" required>
                        <input type="text" placeholder="Thana" required>
                    </div>
                    <textarea placeholder="Write Full Address..." required></textarea>
                    <button type="submit" class="final-btn">Confirm Order</button>
                </form>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
